[package]
name = "tl-collator-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Offline pure-reducer port of the tl-collator service layer (sessions, admission, HTTP dispatch)"

[dependencies]
tl-collator-wire = { path = "../tl-collator-wire" }
tl-rpc-router = { path = "../tl-rpc-router" }
serde_json = "=1.0.145"
secp256k1 = { version = "=0.29.1", default-features = true }

[dev-dependencies]
tl-witness-service = { path = "../tl-witness-service" }
