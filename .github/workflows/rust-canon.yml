name: Rust TL-Canon contract
on:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-canon.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        working-directory: rust/tl-collator-wire
        run: cargo fetch --locked
      - name: Format initial change for committed source
        working-directory: rust/tl-collator-wire
        run: |
          cargo fmt --all
          echo "VERIFY_BEGIN"
          base64 -w0 src/verify.rs
          echo
          echo "VERIFY_END"
          echo "DURABLE_BEGIN"
          base64 -w0 src/durable.rs
          echo
          echo "DURABLE_END"
          echo "TESTS_BEGIN"
          base64 -w0 src/durable_tests.rs
          echo
          echo "TESTS_END"
      - name: Pinned canonical vector fixture
        working-directory: rust/tl-collator-wire
        run: node scripts/verify-fixture.cjs
      - name: Full tests
        working-directory: rust/tl-collator-wire
        run: cargo test --locked --offline
      - name: Clippy
        working-directory: rust/tl-collator-wire
        run: cargo clippy --locked --offline --all-targets -- -D warnings
