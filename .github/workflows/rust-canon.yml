name: Rust TL-Canon contract
on:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-canon.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Resolve signing verification dependency
        working-directory: rust/tl-collator-wire
        run: |
          cargo generate-lockfile
          cargo fetch
          echo LOCK_BEGIN
          base64 -w0 Cargo.lock
          echo
          echo LOCK_END
      - name: Format new module for review
        working-directory: rust/tl-collator-wire
        run: |
          cargo fmt --all
          echo VERIFY_BEGIN
          base64 -w0 src/verify.rs
          echo
          echo VERIFY_END
          echo TEST_BEGIN
          base64 -w0 tests/verified_replay.rs
          echo
          echo TEST_END
      - name: Check pinned fixture
        working-directory: rust/tl-collator-wire
        run: node scripts/verify-fixture.cjs
      - name: Rust tests
        working-directory: rust/tl-collator-wire
        run: cargo test --locked --offline
      - name: Clippy
        working-directory: rust/tl-collator-wire
        run: cargo clippy --locked --offline --all-targets -- -D warnings
