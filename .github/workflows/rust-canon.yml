name: Rust TL-Canon contract
on:
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-canon.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        working-directory: rust/tl-collator-wire
        run: cargo fetch --locked
      - name: Format initial witness files and print for commit
        working-directory: rust/tl-collator-wire
        run: |
          cargo fmt --all
          echo WITNESS_BEGIN
          base64 -w0 src/witness.rs
          echo
          echo WITNESS_END
          echo VERIFY_BEGIN
          base64 -w0 src/verify.rs
          echo
          echo VERIFY_END
          echo WITNESS_TEST_BEGIN
          base64 -w0 tests/witness.rs
          echo
          echo WITNESS_TEST_END
          echo LIB_BEGIN
          base64 -w0 src/lib.rs
          echo
          echo LIB_END
      - name: Pinned TypeScript canonical vectors
        working-directory: rust/tl-collator-wire
        run: node scripts/verify-fixture.cjs
      - name: Run all unit and integration tests
        working-directory: rust/tl-collator-wire
        run: cargo test --locked --offline
      - name: Clippy strict
        working-directory: rust/tl-collator-wire
        run: cargo clippy --locked --offline --all-targets -- -D warnings
