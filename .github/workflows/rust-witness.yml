name: Rust independent witness
on:
  pull_request:
    paths: ['rust/tl-witness-service/**','rust/tl-collator-wire/**','.github/workflows/rust-witness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        working-directory: rust/tl-witness-service
        run: cargo fetch --locked
      - name: Verify committed formatting
        working-directory: rust/tl-witness-service
        run: cargo fmt --all -- --check
      - name: Unit, CLI permissions, synthetic-key CAS tests
        working-directory: rust/tl-witness-service
        run: cargo test --locked --offline
      - name: Strict clippy
        working-directory: rust/tl-witness-service
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Build real OpenSSH integration test
        working-directory: rust/tl-witness-service
        run: cargo test --locked --offline --test openssh --no-run --message-format=json > "$RUNNER_TEMP/witness-ssh-artifacts.jsonl"
      - name: Real encrypted loopback SSH, forced-command roles and recovery drill
        working-directory: rust/tl-witness-service
        run: |
          sshd_binary=/usr/sbin/sshd
          if [ ! -x "$sshd_binary" ]; then
            sudo apt-get update
            mkdir -p "$RUNNER_TEMP/witness-sshd"
            (
              cd "$RUNNER_TEMP/witness-sshd"
              apt-get download openssh-server
              dpkg-deb --extract ./*.deb ./package
            )
            sshd_binary="$RUNNER_TEMP/witness-sshd/package/usr/sbin/sshd"
          fi
          "$sshd_binary" -V
          sudo python3 scripts/run-openssh-test.py --sshd "$sshd_binary" --artifacts "$RUNNER_TEMP/witness-ssh-artifacts.jsonl"
